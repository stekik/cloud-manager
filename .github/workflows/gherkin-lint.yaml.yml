name: gherkin-lint.yaml
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"

jobs:
  gherkin-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ vars.NODE_VERSION }}

      - name: Gherkin format check
        shell: bash
        run: |
          npx -y @cucumber/gherkin-utils@12.0.2 format e2e/features/*.feature
          git diff --exit-code e2e/features

      - name: Gherkin structural lint
        shell: bash
        run: |
          npm install --no-save @cucumber/gherkin@42.0.1 @cucumber/messages@34.2.1
          node e2e/features/lint.mjs e2e/features/*.feature
