name: gherkin-lint.yaml
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"

jobs:
  gherkin-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ vars.NODE_VERSION }}
          cache: npm
          cache-dependency-path: e2e/features/package-lock.json

      - name: Install gherkin tooling
        shell: bash
        working-directory: e2e/features
        run: npm ci

      - name: Gherkin format check
        shell: bash
        run: |
          ./e2e/features/node_modules/.bin/gherkin-utils format e2e/features/*.feature
          git diff --exit-code e2e/features

      - name: Gherkin structural lint
        shell: bash
        run: node e2e/features/lint.mjs e2e/features/*.feature
